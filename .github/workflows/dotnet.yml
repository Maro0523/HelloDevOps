name: .NET Core Build and Run

on:
  push:
    branches:
      - master

permissions: 
  contents: write
  issues: write
  checks: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
        
      - name: Test
        env:
          TESTINGPLATFORM_REPORT_TRX: "true"
          TESTINGPLATFORM_REPORT_TRX_FILENAME: "test-results.trx"
        run: dotnet test TestProject2/TestProject2.csproj --verbosity normal

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET Tests Report
          path: '**/TestResults/test-results.trx'
          reporter: dotnet-trx

      - name: Publish App
        if: success()
        run: dotnet publish -c Release -o ./publish

      - name: Github Release
        uses: ncipollo/release-action@v1
        if: success()
        with:
          artifacts: "./publish/*"
          tag: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automatic release after successful CI pipeline."
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue on Failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/failed_build.md
